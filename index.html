<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gestão do Padrinho</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão do Padrinho">
<meta name="theme-color" content="#0F1419">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<style>
  :root{
    --bg:#0F1419; --surface:#161C24; --surface2:#1A2129; --border:#2A323C;
    --text:#E8E6E1; --muted:#889099; --dim:#6B7480;
    --gold:#C9A15A; --green:#7FBFA6; --red:#D98A8E;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
    height:100%; overscroll-behavior-y:none;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;border-bottom:1px solid #1F2730;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
  .brand{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:2px;}
  main{flex:1;padding:16px 20px 110px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;}
  .month-label{font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;color:#B8BEC7;
    text-transform:capitalize;min-width:150px;text-align:center;}
  .icon-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;color:#B8BEC7;cursor:pointer;font-size:16px;}
  .balance-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;margin-bottom:26px;}
  .balance-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;}
  .balance-number{font-family:var(--font-mono);font-size:34px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
  .balance-divider{height:1px;background:var(--border);margin:18px 0 16px;}
  .balance-row{display:flex;align-items:stretch;}
  .balance-col{flex:1;display:flex;flex-direction:column;gap:4px;}
  .balance-col-divider{width:1px;background:var(--border);margin:0 16px;}
  .balance-col-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;}
  .balance-col-value{font-family:var(--font-mono);font-size:17px;font-weight:600;}
  .section-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--dim);
    text-transform:uppercase;margin:6px 0 12px;}
  .empty-note{font-size:13px;color:var(--dim);padding:8px 0 20px;line-height:1.5;}
  .cat-list{display:flex;flex-direction:column;gap:14px;margin-bottom:28px;}
  .cat-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .cat-name{color:#B8BEC7;}
  .cat-value{font-family:var(--font-mono);color:var(--text);}
  .cat-bar-track{height:5px;background:#1F2730;border-radius:3px;overflow:hidden;}
  .cat-bar-fill{height:100%;background:var(--gold);border-radius:3px;}
  .loan-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .loan-summary-row{display:flex;justify-content:space-between;align-items:center;}
  .tx-list{display:flex;flex-direction:column;}
  .tx-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1A2129;}
  .tx-dot{width:8px;height:8px;border-radius:4px;flex-shrink:0;}
  .tx-info{flex:1;min-width:0;}
  .tx-desc{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-meta{font-size:11px;color:var(--dim);margin-top:2px;}
  .tx-amount{font-family:var(--font-mono);font-size:15px;}
  .trash-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--dim);font-size:15px;}
  .loan-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;
    margin-bottom:14px;display:flex;flex-direction:column;gap:10px;}
  .loan-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .loan-borrower{font-family:var(--font-display);font-size:17px;font-weight:600;}
  .loan-borrower.owed{color:var(--red);}
  .loan-borrower.paid{color:var(--green);}
  .small-btn{background:#1F2730;border:1px solid var(--border);color:var(--gold);font-size:11px;
    padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .paid-badge{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--green);
    background:#17251F;border:1px solid #274A3B;padding:4px 8px;border-radius:8px;white-space:nowrap;}
  .overdue-badge{align-self:flex-start;font-size:11px;color:var(--red);background:#3A2323;
    border:1px solid #5A3333;padding:4px 8px;border-radius:8px;}
  .trash-btn-loan{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--dim);
    font-size:12px;cursor:pointer;align-self:flex-end;padding:2px 0;}
  .fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:calc(50% - 240px + 20px);
    background:var(--gold);width:52px;height:52px;border-radius:26px;border:none;display:flex;
    align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(201,161,90,.35);
    font-size:26px;color:#0F1419;line-height:1;}
  @media (max-width:520px){ .fab{right:20px;} }
  .tabbar{display:flex;border-top:1px solid #1F2730;background:var(--bg);position:sticky;bottom:0;
    padding-bottom:env(safe-area-inset-bottom);}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;
    background:none;border:none;cursor:pointer;color:var(--dim);font-family:var(--font-body);}
  .tab-btn.active{color:var(--gold);}
  .tab-btn .ic{font-size:19px;}
  .tab-label{font-size:10px;letter-spacing:.03em;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;
    justify-content:center;z-index:30;}
  .sheet{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;
    max-width:480px;padding:10px 20px calc(28px + env(safe-area-inset-bottom));max-height:88vh;
    overflow-y:auto;border:1px solid var(--border);border-bottom:none;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:6px auto 14px;}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-title{font-family:var(--font-display);font-size:19px;font-weight:600;}
  .segmented{display:flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:16px;
    border:1px solid var(--border);}
  .seg-btn{flex:1;padding:9px 0;border-radius:8px;border:none;background:none;color:var(--muted);
    font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-body);}
  .seg-btn.active-expense{background:#3A2323;color:var(--red);}
  .seg-btn.active-income{background:#17251F;color:var(--green);}
  .seg-btn.active-gold{background:#2A2417;color:var(--gold);}
  label.field-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    display:block;margin:14px 0 6px;}
  input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;color:var(--text);font-size:15px;font-family:var(--font-body);}
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .save-btn{width:100%;background:var(--gold);border:none;border-radius:12px;padding:14px 0;color:#0F1419;
    font-size:15px;font-weight:600;margin-top:22px;cursor:pointer;font-family:var(--font-body);}
  .save-btn:disabled{opacity:.5;}
  .error-banner{background:#3A2323;color:var(--red);font-size:13px;padding:8px 20px;}
  .info-banner{background:#2A2417;color:var(--gold);font-size:12px;padding:8px 20px;text-align:center;}

  /* ---- login / gate screens ---- */
  .gate-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:6px;}
  .gate-title{font-family:var(--font-display);font-size:26px;font-weight:600;text-align:center;margin-bottom:4px;}
  .gate-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;}
  .gate-btn{width:100%;background:var(--gold);border:none;border-radius:12px;padding:14px 0;color:#0F1419;
    font-size:15px;font-weight:600;margin-top:18px;cursor:pointer;}
  .gate-btn:disabled{opacity:.5;}
  .link-btn{background:none;border:none;color:var(--dim);font-size:12px;text-decoration:underline;
    cursor:pointer;margin-top:14px;align-self:center;}

  /* ---- admin tab ---- */
  .user-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
    margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .user-name{font-weight:600;font-size:15px;}
  .user-role{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .toggle{position:relative;width:44px;height:26px;border-radius:13px;background:#3A2323;border:1px solid var(--border);
    cursor:pointer;flex-shrink:0;}
  .toggle.on{background:#17251F;border-color:#274A3B;}
  .toggle-dot{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:var(--red);
    transition:transform .15s ease;}
  .toggle.on .toggle-dot{transform:translateX(18px);background:var(--green);}
  .user-actions{display:flex;gap:8px;align-items:center;}
  .viewing-banner{background:var(--surface2);border:1px solid var(--gold);color:var(--gold);font-size:12px;
    padding:10px 14px;border-radius:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="eyebrow">caderneta financeira</div>
      <div class="brand">Gestão do Padrinho</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="icon-btn" id="logoutBtn" title="Sair" style="display:none;">⏻</button>
      <div style="font-size:24px;">🥷🏿</div>
    </div>
  </header>
  <div id="errorBanner" class="error-banner" style="display:none;"></div>
  <div id="gateArea"></div>
  <main id="main" style="display:none;"></main>
  <button class="fab" id="fabBtn" style="display:none;">+</button>
  <nav class="tabbar" id="tabbar" style="display:none;">
    <button class="tab-btn" data-tab="resumo"><span class="ic">◐</span><span class="tab-label">Resumo</span></button>
    <button class="tab-btn" data-tab="lancamentos"><span class="ic">≡</span><span class="tab-label">Lançamentos</span></button>
    <button class="tab-btn" data-tab="emprestimos"><span class="ic">%</span><span class="tab-label">Empréstimos</span></button>
    <button class="tab-btn" data-tab="usuarios" id="tabUsuarios" style="display:none;"><span class="ic">☺</span><span class="tab-label">Usuários</span></button>
  </nav>
</div>

<!-- Firebase (compat SDK, simples de usar sem build step) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
'use strict';

// =====================================================================
// CONFIGURAÇÃO DO FIREBASE — troque pelos dados do SEU projeto Firebase
// (Console Firebase > Configurações do projeto > Seus apps > Config)
// =====================================================================
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI.firebaseapp.com",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI.appspot.com",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};
const EMAIL_DOMAIN = 'gestaodopadrinho.app'; // domínio interno fictício p/ converter usuário -> email

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---------- helpers ----------
const fmt = n => (n||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const monthLabel = d => d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
const isSameMonth = (iso, ref) => {
  const d = new Date(iso+'T00:00:00');
  return d.getMonth()===ref.getMonth() && d.getFullYear()===ref.getFullYear();
};
const monthsElapsed = (startISO, endDate) => {
  const start = new Date(startISO+'T00:00:00');
  const days = Math.floor((endDate-start)/86400000);
  return Math.max(0, Math.floor(days/30));
};
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const todayISO = () => new Date().toISOString().slice(0,10);
const escapeHtml = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showError(msg){
  const el = document.getElementById('errorBanner');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 4000);
}
function usernameToEmail(u){ return `${u.trim().toLowerCase()}@${EMAIL_DOMAIN}`; }

const CATS_EXPENSE = ['Moradia','Alimentação','Transporte','Saúde','Lazer','Contas','Empréstimo','Outros'];
const CATS_INCOME = ['Salário','Freelance','Rendimentos','Empréstimo recebido','Outros'];

// ---------- loan helpers ----------
function normalizeLoan(l){
  return Object.assign({
    calcMode: 'rate', rate: 0, compound: false, expectedAmount: null,
    dueDate: null, lateFee: { mode: 'fixed', value: 0 },
  }, l);
}
function computeLoanAmounts(l, asOfDate){
  let baseTotal;
  if(l.calcMode === 'fixed'){
    baseTotal = (l.expectedAmount != null) ? l.expectedAmount : l.principal;
  }else{
    const m = monthsElapsed(l.startDate, asOfDate);
    const juros = l.compound ? l.principal*(Math.pow(1+l.rate/100,m)-1) : l.principal*(l.rate/100)*m;
    baseTotal = l.principal + juros;
  }
  let daysLate = 0, lateFeeTotal = 0;
  if(l.dueDate){
    const due = midnight(new Date(l.dueDate+'T00:00:00'));
    const ref = midnight(asOfDate);
    if(ref > due){
      daysLate = Math.round((ref-due)/86400000);
      const feeVal = (l.lateFee && l.lateFee.value) || 0;
      if(feeVal > 0){
        lateFeeTotal = (l.lateFee.mode === 'percent')
          ? baseTotal * (feeVal/100) * daysLate
          : feeVal * daysLate;
      }
    }
  }
  return { baseTotal, juros: baseTotal - l.principal, daysLate, lateFeeTotal, total: baseTotal + lateFeeTotal };
}

// ---------- state ----------
const state = {
  data: { transactions: [], loans: [] },
  tab: 'resumo',
  refMonth: new Date(),
  currentUser: null,   // { uid, username, role }
  viewingUid: null,    // qual usuário está sendo exibido (== currentUser.uid, exceto quando admin espia outro)
  viewingUsername: null,
  allUsers: [],         // só preenchido para admin
  unsubTx: null,
  unsubLoans: null,
  unsubUsers: null,
};

// =====================================================================
// AUTENTICAÇÃO / GATE
// =====================================================================
const gateArea = document.getElementById('gateArea');
const mainEl = document.getElementById('main');
const fabBtn = document.getElementById('fabBtn');
const tabbarEl = document.getElementById('tabbar');
const logoutBtn = document.getElementById('logoutBtn');

function showApp(show){
  mainEl.style.display = show ? 'block' : 'none';
  fabBtn.style.display = show ? 'flex' : 'none';
  tabbarEl.style.display = show ? 'flex' : 'none';
  logoutBtn.style.display = show ? 'flex' : 'none';
  gateArea.style.display = show ? 'none' : 'block';
}

function renderLoginScreen(){
  showApp(false);
  gateArea.innerHTML = `
    <div class="gate-screen">
      <div class="gate-title">Gestão do Padrinho</div>
      <div class="gate-sub">Entre com o usuário e senha que você recebeu</div>
      <label class="field-label">Usuário</label>
      <input id="loginUser" autocapitalize="off" autocomplete="username" placeholder="seu.usuario">
      <label class="field-label">Senha</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="gate-btn" id="loginBtn">Entrar</button>
    </div>
  `;
  document.getElementById('loginBtn').onclick = () => {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    if(!u || !p){ showError('Preencha usuário e senha.'); return; }
    auth.signInWithEmailAndPassword(usernameToEmail(u), p)
      .catch(err => showError('Usuário ou senha inválidos.'));
  };
}

function renderDisabledScreen(username){
  showApp(false);
  gateArea.innerHTML = `
    <div class="gate-screen">
      <div class="gate-title">Acesso desativado</div>
      <div class="gate-sub">O acesso de <b>${escapeHtml(username)}</b> foi desativado pelo administrador. Fale com quem te deu acesso.</div>
      <button class="gate-btn" id="backBtn">Voltar ao login</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = () => auth.signOut();
}

logoutBtn.onclick = () => auth.signOut();

auth.onAuthStateChanged(async (user) => {
  detachListeners();
  if(!user){
    state.currentUser = null;
    renderLoginScreen();
    return;
  }
  try{
    const snap = await db.collection('users').doc(user.uid).get();
    if(!snap.exists){
      showError('Conta sem cadastro. Fale com o administrador.');
      auth.signOut();
      return;
    }
    const profile = snap.data();
    if(profile.active === false){
      renderDisabledScreen(profile.username || user.email);
      return;
    }
    state.currentUser = { uid: user.uid, username: profile.username, role: profile.role || 'user' };
    state.viewingUid = user.uid;
    state.viewingUsername = profile.username;
    document.getElementById('tabUsuarios').style.display = state.currentUser.role === 'admin' ? '' : 'none';
    showApp(true);
    attachDataListeners(state.viewingUid);
    if(state.currentUser.role === 'admin') attachUsersListener();
    render();
  }catch(e){
    showError('Erro ao carregar conta: ' + e.message);
  }
});

function detachListeners(){
  if(state.unsubTx) state.unsubTx();
  if(state.unsubLoans) state.unsubLoans();
  if(state.unsubUsers) state.unsubUsers();
  state.unsubTx = state.unsubLoans = state.unsubUsers = null;
}

function attachDataListeners(uid){
  if(state.unsubTx) state.unsubTx();
  if(state.unsubLoans) state.unsubLoans();
  state.unsubTx = db.collection('users').doc(uid).collection('transactions')
    .onSnapshot(qs => {
      state.data.transactions = qs.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => showError('Erro ao carregar lançamentos: '+err.message));
  state.unsubLoans = db.collection('users').doc(uid).collection('loans')
    .onSnapshot(qs => {
      state.data.loans = qs.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => showError('Erro ao carregar empréstimos: '+err.message));
}

function attachUsersListener(){
  if(state.unsubUsers) state.unsubUsers();
  state.unsubUsers = db.collection('users').onSnapshot(qs => {
    state.allUsers = qs.docs.map(d => ({ uid: d.id, ...d.data() }));
    if(state.tab === 'usuarios') render();
  }, err => showError('Erro ao carregar usuários: '+err.message));
}

function switchViewing(uid, username){
  state.viewingUid = uid;
  state.viewingUsername = username;
  attachDataListeners(uid);
  state.tab = 'resumo';
  render();
}

// ---------- Firestore writes (equivalentes ao antigo saveData) ----------
function dataCol(name){
  return db.collection('users').doc(state.viewingUid).collection(name);
}
function addTransaction(tx){ return dataCol('transactions').add(tx).catch(e=>showError('Erro ao salvar: '+e.message)); }
function deleteTransaction(id){ return dataCol('transactions').doc(id).delete().catch(e=>showError('Erro ao excluir: '+e.message)); }
function addLoan(loan){ return dataCol('loans').add(loan).catch(e=>showError('Erro ao salvar: '+e.message)); }
function updateLoan(id, patch){ return dataCol('loans').doc(id).update(patch).catch(e=>showError('Erro ao atualizar: '+e.message)); }
function deleteLoan(id){ return dataCol('loans').doc(id).delete().catch(e=>showError('Erro ao excluir: '+e.message)); }

// =====================================================================
// RENDER ROOT
// =====================================================================
function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  fabBtn.style.display = (state.tab === 'usuarios') ? 'none' : 'flex';
  const banner = (state.currentUser && state.currentUser.role === 'admin' && state.viewingUid !== state.currentUser.uid)
    ? `<div class="viewing-banner"><span>Visualizando dados de <b>${escapeHtml(state.viewingUsername)}</b></span><button class="small-btn" id="backToMine">meus dados</button></div>`
    : '';
  if(state.tab === 'resumo') mainEl.innerHTML = banner + renderResumo();
  else if(state.tab === 'lancamentos') mainEl.innerHTML = banner + renderLancamentos();
  else if(state.tab === 'emprestimos') mainEl.innerHTML = banner + renderEmprestimos();
  else mainEl.innerHTML = renderUsuarios();
  attachMainListeners();
}

// ---------- Resumo ----------
function renderResumo(){
  const refMonth = state.refMonth;
  const monthTx = state.data.transactions.filter(t => isSameMonth(t.date, refMonth));
  const totalIncome = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const totalExpense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const saldo = totalIncome - totalExpense;

  const activeLoans = state.data.loans.filter(l=>l.status!=='paid').map(normalizeLoan);
  const totalEmprestado = activeLoans.reduce((s,l)=>s+l.principal,0);
  let totalJuros = 0, totalMulta = 0;
  activeLoans.forEach(l=>{
    const { juros, lateFeeTotal } = computeLoanAmounts(l, new Date());
    totalJuros += juros;
    totalMulta += lateFeeTotal;
  });

  const byCat = {};
  monthTx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const maxCat = Math.max(1, ...Object.values(byCat));
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  return `
    <div class="month-nav">
      <button class="icon-btn" id="prevMonth">‹</button>
      <div class="month-label">${monthLabel(refMonth)}</div>
      <button class="icon-btn" id="nextMonth">›</button>
    </div>
    <div class="balance-card">
      <div class="balance-eyebrow">saldo do mês</div>
      <div class="balance-number" style="color:${saldo>=0?'#7FBFA6':'#D98A8E'}">${fmt(saldo)}</div>
      <div class="balance-divider"></div>
      <div class="balance-row">
        <div class="balance-col">
          <span class="balance-col-label">↑ Entradas</span>
          <span class="balance-col-value" style="color:#7FBFA6">${fmt(totalIncome)}</span>
        </div>
        <div class="balance-col-divider"></div>
        <div class="balance-col">
          <span class="balance-col-label">↓ Saídas</span>
          <span class="balance-col-value" style="color:#D98A8E">${fmt(totalExpense)}</span>
        </div>
      </div>
    </div>
    <div class="section-title">gastos por categoria</div>
    ${catEntries.length===0 ? '<div class="empty-note">Nenhum gasto lançado este mês.</div>' : `
    <div class="cat-list">
      ${catEntries.map(([cat,val])=>`
        <div>
          <div class="cat-row-top"><span class="cat-name">${escapeHtml(cat)}</span><span class="cat-value">${fmt(val)}</span></div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(val/maxCat)*100}%"></div></div>
        </div>
      `).join('')}
    </div>`}
    <div class="section-title">dinheiro emprestado a juros</div>
    <div class="loan-summary-card">
      <div class="loan-summary-row"><span class="balance-col-label">Capital emprestado</span><span style="font-family:var(--font-mono);font-size:17px;">${fmt(totalEmprestado)}</span></div>
      <div class="loan-summary-row"><span class="balance-col-label">Juros acumulados</span><span style="font-family:var(--font-mono);font-size:17px;color:var(--gold);">${fmt(totalJuros)}</span></div>
      ${totalMulta>0 ? `<div class="loan-summary-row"><span class="balance-col-label" style="color:var(--red)">Multa por atraso</span><span style="font-family:var(--font-mono);font-size:17px;color:var(--red);">${fmt(totalMulta)}</span></div>` : ''}
      <div class="loan-summary-row" style="border-top:1px solid var(--border);padding-top:10px;margin-top:2px;">
        <span class="balance-col-label" style="color:var(--text)">A receber no total</span>
        <span style="font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--gold);">${fmt(totalEmprestado+totalJuros+totalMulta)}</span>
      </div>
    </div>
  `;
}

// ---------- Lançamentos ----------
function renderLancamentos(){
  const refMonth = state.refMonth;
  const list = state.data.transactions
    .filter(t=>isSameMonth(t.date, refMonth))
    .sort((a,b)=> a.date < b.date ? 1 : -1);
  return `
    <div class="month-nav">
      <button class="icon-btn" id="prevMonth">‹</button>
      <div class="month-label">${monthLabel(refMonth)}</div>
      <button class="icon-btn" id="nextMonth">›</button>
    </div>
    ${list.length===0 ? '<div class="empty-note">Nenhum lançamento neste mês. Toque em + para adicionar.</div>' : `
    <div class="tx-list">
      ${list.map(t=>`
        <div class="tx-row">
          <div class="tx-dot" style="background:${t.type==='income'?'var(--green)':'var(--red)'}"></div>
          <div class="tx-info">
            <div class="tx-desc">${escapeHtml(t.description) || escapeHtml(t.category)}</div>
            <div class="tx-meta">${escapeHtml(t.category)} · ${new Date(t.date+'T00:00:00').toLocaleDateString('pt-BR')}</div>
          </div>
          <div class="tx-amount" style="color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?'+':'-'} ${fmt(t.amount)}</div>
          <button class="trash-btn" data-delete-tx="${t.id}">✕</button>
        </div>
      `).join('')}
    </div>`}
  `;
}

// ---------- Empréstimos ----------
function loanCardHtml(l){
  const isPaid = l.status === 'paid';
  const { juros, lateFeeTotal, daysLate, total } = computeLoanAmounts(l, isPaid ? new Date(l.paidDate+'T00:00:00') : new Date());
  return `
    <div class="loan-card">
      <div class="loan-card-top">
        <div class="loan-borrower ${isPaid ? 'paid' : 'owed'}">${escapeHtml(l.borrower)}</div>
        ${isPaid ? '<span class="paid-badge">✓ quitado</span>' : `<button class="small-btn" data-mark-paid="${l.id}">Dar baixa</button>`}
      </div>
      ${(!isPaid && daysLate>0) ? `<span class="overdue-badge">⚠ ${daysLate} dia${daysLate>1?'s':''} de atraso</span>` : ''}
      <div class="loan-summary-row"><span class="balance-col-label">Capital</span><span style="font-family:var(--font-mono);font-size:15px;">${fmt(l.principal)}</span></div>
      <div class="loan-summary-row"><span class="balance-col-label">Juros</span><span style="font-family:var(--font-mono);font-size:15px;color:var(--gold);">${fmt(juros)}</span></div>
      ${lateFeeTotal>0 ? `<div class="loan-summary-row"><span class="balance-col-label" style="color:var(--red)">Multa por atraso</span><span style="font-family:var(--font-mono);font-size:15px;color:var(--red);">${fmt(lateFeeTotal)}</span></div>` : ''}
      <div class="loan-summary-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:2px;">
        <span class="balance-col-label" style="color:var(--text)">Total</span>
        <span style="font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--gold);">${fmt(total)}</span>
      </div>
      <button class="trash-btn-loan" data-delete-loan="${l.id}">✕ excluir</button>
    </div>
  `;
}
function renderEmprestimos(){
  const loans = state.data.loans.map(normalizeLoan);
  const active = loans.filter(l=>l.status!=='paid');
  const paid = loans.filter(l=>l.status==='paid');
  return `
    <div class="section-title">ativos</div>
    ${active.length===0 ? '<div class="empty-note">Nenhum empréstimo ativo. Toque em + para registrar.</div>' : active.map(loanCardHtml).join('')}
    ${paid.length>0 ? `<div class="section-title">quitados</div>${paid.map(loanCardHtml).join('')}` : ''}
  `;
}

// ---------- Usuários (admin) ----------
function renderUsuarios(){
  const users = state.allUsers.slice().sort((a,b)=> (a.username||'').localeCompare(b.username||''));
  return `
    <div class="section-title">contas com acesso</div>
    ${users.length===0 ? '<div class="empty-note">Carregando usuários...</div>' : users.map(u=>`
      <div class="user-card">
        <div>
          <div class="user-name">${escapeHtml(u.username||'(sem nome)')}</div>
          <div class="user-role">${u.role==='admin'?'administrador':'usuário'}</div>
        </div>
        <div class="user-actions">
          ${u.uid !== state.currentUser.uid ? `<button class="small-btn" data-view-user="${u.uid}" data-view-username="${escapeHtml(u.username||'')}">ver ledger</button>` : ''}
          <div class="toggle ${u.active!==false ? 'on':''}" data-toggle-active="${u.uid}" data-current="${u.active!==false}"><div class="toggle-dot"></div></div>
        </div>
      </div>
    `).join('')}
    <button class="save-btn" id="openAddUser" style="margin-top:10px;">+ Adicionar usuário</button>
  `;
}

// ---------- listeners for rendered content ----------
function attachMainListeners(){
  const prev = document.getElementById('prevMonth');
  const next = document.getElementById('nextMonth');
  if(prev) prev.onclick = () => { shiftMonth(-1); };
  if(next) next.onclick = () => { shiftMonth(1); };

  const backBtn = document.getElementById('backToMine');
  if(backBtn) backBtn.onclick = () => switchViewing(state.currentUser.uid, state.currentUser.username);

  document.querySelectorAll('[data-delete-tx]').forEach(btn=>{
    btn.onclick = () => deleteTransaction(btn.getAttribute('data-delete-tx'));
  });
  document.querySelectorAll('[data-mark-paid]').forEach(btn=>{
    btn.onclick = () => openMarkPaidForm(btn.getAttribute('data-mark-paid'));
  });
  document.querySelectorAll('[data-delete-loan]').forEach(btn=>{
    btn.onclick = () => deleteLoan(btn.getAttribute('data-delete-loan'));
  });

  // admin: usuários
  document.querySelectorAll('[data-view-user]').forEach(btn=>{
    btn.onclick = () => switchViewing(btn.getAttribute('data-view-user'), btn.getAttribute('data-view-username'));
  });
  document.querySelectorAll('[data-toggle-active]').forEach(el=>{
    el.onclick = () => {
      const uid = el.getAttribute('data-toggle-active');
      const current = el.getAttribute('data-current') === 'true';
      db.collection('users').doc(uid).update({ active: !current })
        .catch(e=>showError('Erro ao atualizar acesso: '+e.message));
    };
  });
  const addUserBtn = document.getElementById('openAddUser');
  if(addUserBtn) addUserBtn.onclick = openAddUserForm;
}

function shiftMonth(delta){
  const d = new Date(state.refMonth);
  d.setMonth(d.getMonth()+delta);
  state.refMonth = d;
  render();
}

// ---------- tab bar ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.tab = btn.dataset.tab;
    render();
  });
});

// ---------- FAB ----------
fabBtn.addEventListener('click', ()=>{

// ---------- Tx form ----------
function openTxForm(){
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Novo lançamento</div>
        <button class="icon-btn" id="closeTxForm">✕</button>
      </div>
      <div class="segmented">
        <button type="button" class="seg-btn active-expense" id="segExpense">Saída</button>
        <button type="button" class="seg-btn" id="segIncome">Entrada</button>
      </div>
      <label class="field-label">Valor</label>
      <input id="txAmount" inputmode="decimal" placeholder="0,00">
      <label class="field-label">Descrição</label>
      <input id="txDesc" placeholder="Ex: Supermercado">
      <label class="field-label">Categoria</label>
      <select id="txCategory"></select>
      <label class="field-label">Data</label>
      <input id="txDate" type="date" value="${todayISO()}">
      <button class="save-btn" id="txSave" disabled>Salvar lançamento</button>
    </div>
  `;
  document.body.appendChild(overlay);
  let type = 'expense';

  function fillCategories(){
    const sel = overlay.querySelector('#txCategory');
    const cats = type==='expense' ? CATS_EXPENSE : CATS_INCOME;
    sel.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  }
  fillCategories();

  const segExpense = overlay.querySelector('#segExpense');
  const segIncome = overlay.querySelector('#segIncome');
  segExpense.onclick = () => { type='expense'; segExpense.classList.add('active-expense'); segIncome.classList.remove('active-income'); fillCategories(); };
  segIncome.onclick = () => { type='income'; segIncome.classList.add('active-income'); segExpense.classList.remove('active-expense'); fillCategories(); };

  const amountInput = overlay.querySelector('#txAmount');
  const saveBtn = overlay.querySelector('#txSave');
  function validate(){
    const v = parseFloat(amountInput.value.replace(',','.'));
    saveBtn.disabled = !(v > 0);
  }
  amountInput.oninput = validate;

  overlay.querySelector('#closeTxForm').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  saveBtn.onclick = () => {
    const amount = parseFloat(amountInput.value.replace(',','.'));
    if(!(amount>0)) return;
    addTransaction({
      type,
      description: overlay.querySelector('#txDesc').value.trim(),
      amount,
      category: overlay.querySelector('#txCategory').value,
      date: overlay.querySelector('#txDate').value || todayISO(),
    });
    overlay.remove();
  };
}

// ---------- Loan form ----------
function openLoanForm(){
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Novo empréstimo</div>
        <button class="icon-btn" id="closeLoanForm">✕</button>
      </div>
      <label class="field-label">Para quem</label>
      <input id="loanBorrower" placeholder="Nome da pessoa">
      <label class="field-label">Valor emprestado</label>
      <input id="loanPrincipal" inputmode="decimal" placeholder="0,00">

      <div class="segmented">
        <button type="button" class="seg-btn active-gold" id="segRateMode">Calcular por juros</button>
        <button type="button" class="seg-btn" id="segFixedMode">Valor fixo a receber</button>
      </div>

      <div id="rateModeFields">
        <label class="field-label">Juros ao mês (%)</label>
        <input id="loanRate" inputmode="decimal" placeholder="Ex: 5">
        <div class="segmented">
          <button type="button" class="seg-btn active-gold" id="segSimples">Juros simples</button>
          <button type="button" class="seg-btn" id="segComposto">Juros compostos</button>
        </div>
      </div>
      <div id="fixedModeFields" style="display:none;">
        <label class="field-label">Valor total a receber</label>
        <input id="loanExpected" inputmode="decimal" placeholder="0,00">
      </div>

      <label class="field-label">Data do empréstimo</label>
      <input id="loanDate" type="date" value="${todayISO()}">
      <label class="field-label">Data de vencimento</label>
      <input id="loanDue" type="date">

      <label class="field-label">Multa por atraso (por dia)</label>
      <div class="segmented">
        <button type="button" class="seg-btn active-gold" id="segFeeFixed">Fixo (R$/dia)</button>
        <button type="button" class="seg-btn" id="segFeePercent">Percentual (%/dia)</button>
      </div>
      <input id="loanFeeValue" inputmode="decimal" placeholder="Ex: 5" value="0">

      <button class="save-btn" id="loanSave" disabled>Salvar empréstimo</button>
    </div>
  `;
  document.body.appendChild(overlay);

  let calcMode = 'rate';
  let compound = false;
  let feeMode = 'fixed';

  const rateModeFields = overlay.querySelector('#rateModeFields');
  const fixedModeFields = overlay.querySelector('#fixedModeFields');
  const segRateMode = overlay.querySelector('#segRateMode');
  const segFixedMode = overlay.querySelector('#segFixedMode');
  segRateMode.onclick = () => {
    calcMode='rate'; segRateMode.classList.add('active-gold'); segFixedMode.classList.remove('active-gold');
    rateModeFields.style.display=''; fixedModeFields.style.display='none'; validate();
  };
  segFixedMode.onclick = () => {
    calcMode='fixed'; segFixedMode.classList.add('active-gold'); segRateMode.classList.remove('active-gold');
    rateModeFields.style.display='none'; fixedModeFields.style.display=''; validate();
  };

  const segSimples = overlay.querySelector('#segSimples');
  const segComposto = overlay.querySelector('#segComposto');
  segSimples.onclick = () => { compound=false; segSimples.classList.add('active-gold'); segComposto.classList.remove('active-gold'); };
  segComposto.onclick = () => { compound=true; segComposto.classList.add('active-gold'); segSimples.classList.remove('active-gold'); };

  const segFeeFixed = overlay.querySelector('#segFeeFixed');
  const segFeePercent = overlay.querySelector('#segFeePercent');
  segFeeFixed.onclick = () => { feeMode='fixed'; segFeeFixed.classList.add('active-gold'); segFeePercent.classList.remove('active-gold'); };
  segFeePercent.onclick = () => { feeMode='percent'; segFeePercent.classList.add('active-gold'); segFeeFixed.classList.remove('active-gold'); };

  const borrowerInput = overlay.querySelector('#loanBorrower');
  const principalInput = overlay.querySelector('#loanPrincipal');
  const rateInput = overlay.querySelector('#loanRate');
  const expectedInput = overlay.querySelector('#loanExpected');
  const saveBtn = overlay.querySelector('#loanSave');

  function validate(){
    const p = parseFloat(principalInput.value.replace(',','.'));
    const borrowerOk = !!borrowerInput.value.trim();
    let modeOk = false;
    if(calcMode === 'rate'){
      const r = parseFloat(rateInput.value.replace(',','.'));
      modeOk = !isNaN(r);
    }else{
      const e = parseFloat(expectedInput.value.replace(',','.'));
      modeOk = e > 0;
    }
    saveBtn.disabled = !(borrowerOk && p > 0 && modeOk);
  }
  [borrowerInput, principalInput, rateInput, expectedInput].forEach(el => el.oninput = validate);

  overlay.querySelector('#closeLoanForm').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  saveBtn.onclick = () => {
    const principal = parseFloat(principalInput.value.replace(',','.'));
    const rate = parseFloat(rateInput.value.replace(',','.')) || 0;
    const expected = parseFloat(expectedInput.value.replace(',','.')) || null;
    if(!(borrowerInput.value.trim() && principal>0)) return;
    if(calcMode==='rate' && isNaN(rate)) return;
    if(calcMode==='fixed' && !(expected>0)) return;

    const feeValue = parseFloat(overlay.querySelector('#loanFeeValue').value.replace(',','.')) || 0;
    const borrowerName = borrowerInput.value.trim();
    const loanStartDate = overlay.querySelector('#loanDate').value || todayISO();

    addLoan({
      borrower: borrowerName,
      principal,
      calcMode,
      rate: calcMode==='rate' ? rate : 0,
      compound,
      expectedAmount: calcMode==='fixed' ? expected : null,
      startDate: loanStartDate,
      dueDate: overlay.querySelector('#loanDue').value || null,
      lateFee: { mode: feeMode, value: feeValue },
      status: 'active',
    });

    addTransaction({
      type: 'expense',
      description: `Empréstimo concedido - ${borrowerName}`,
      amount: principal,
      category: 'Empréstimo',
      date: loanStartDate,
    });

    overlay.remove();
  };
}

// ---------- Dar baixa (mark as paid) form ----------
function openMarkPaidForm(loanId){
  const loan = state.data.loans.find(l=>l.id===loanId);
  if(!loan) return;
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Dar baixa · ${escapeHtml(loan.borrower)}</div>
        <button class="icon-btn" id="closePaidForm">✕</button>
      </div>
      <label class="field-label">Data do pagamento</label>
      <input id="paidDateInput" type="date" value="${todayISO()}">
      <button class="save-btn" id="paidSave">Confirmar pagamento</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#closePaidForm').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  overlay.querySelector('#paidSave').onclick = () => {
    const paidDate = overlay.querySelector('#paidDateInput').value || todayISO();
    const normalized = normalizeLoan(loan);
    const { juros, lateFeeTotal } = computeLoanAmounts(normalized, new Date(paidDate+'T00:00:00'));
    const totalGanho = juros + lateFeeTotal;

    updateLoan(loanId, { status:'paid', paidDate });

    if(totalGanho > 0){
      const desc = lateFeeTotal > 0
        ? `Juros + multa recebidos - ${loan.borrower}`
        : `Juros recebido - ${loan.borrower}`;
      addTransaction({
        type: 'income',
        description: desc,
        amount: totalGanho,
        category: 'Rendimentos',
        date: paidDate,
      });
    }
    overlay.remove();
  };
}

// ---------- Adicionar usuário (admin) ----------
function openAddUserForm(){
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Adicionar usuário</div>
        <button class="icon-btn" id="closeAddUser">✕</button>
      </div>
      <label class="field-label">Nome de usuário (sem espaços)</label>
      <input id="newUsername" autocapitalize="off" placeholder="ex: joao.silva">
      <label class="field-label">Senha temporária</label>
      <input id="newPassword" type="text" placeholder="mínimo 6 caracteres">
      <label class="field-label">Tipo de conta</label>
      <select id="newRole">
        <option value="user">Usuário comum</option>
        <option value="admin">Administrador</option>
      </select>
      <button class="save-btn" id="addUserSave">Criar acesso</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeAddUser').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  overlay.querySelector('#addUserSave').onclick = async () => {
    const username = overlay.querySelector('#newUsername').value.trim();
    const password = overlay.querySelector('#newPassword').value;
    const role = overlay.querySelector('#newRole').value;
    if(!username || password.length < 6){
      showError('Preencha usuário e uma senha com 6+ caracteres.');
      return;
    }
    const btn = overlay.querySelector('#addUserSave');
    btn.disabled = true; btn.textContent = 'Criando...';
    // App secundário evita deslogar o admin ao criar a nova conta
    let secondaryApp;
    try{
      secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary-' + Date.now());
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(usernameToEmail(username), password);
      await db.collection('users').doc(cred.user.uid).set({
        username, role, active: true, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await secondaryApp.auth().signOut();
      overlay.remove();
    }catch(e){
      showError('Erro ao criar usuário: ' + e.message);
      btn.disabled = false; btn.textContent = 'Criar acesso';
    }finally{
      if(secondaryApp) secondaryApp.delete().catch(()=>{});
    }
  };
}
