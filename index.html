<style>
  :root{
    --bg:#0F1419; --surface:#161C24; --surface2:#1A2129; --border:#2A323C;
    --text:#E8E6E1; --muted:#889099; --dim:#6B7480;
    --gold:#C9A15A; --green:#7FBFA6; --red:#D98A8E;
    --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
    height:100%; overscroll-behavior-y:none;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;border-bottom:1px solid #1F2730;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
  .brand{font-family:var(--font-display);font-size:25px;font-weight:700;margin-top:2px;letter-spacing:.01em;text-transform:uppercase;}
  main{flex:1;padding:16px 20px 110px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;}
  .month-label{font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;color:#B8BEC7;
    text-transform:capitalize;min-width:150px;text-align:center;}
  .icon-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;color:#B8BEC7;cursor:pointer;font-size:16px;}
  .balance-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;margin-bottom:26px;}
  .balance-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;}
  .balance-number{font-family:var(--font-mono);font-size:34px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
  .balance-divider{height:1px;background:var(--border);margin:18px 0 16px;}
  .balance-row{display:flex;align-items:stretch;}
  .balance-col{flex:1;display:flex;flex-direction:column;gap:4px;}
  .balance-col-divider{width:1px;background:var(--border);margin:0 16px;}
  .balance-col-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;}
  .balance-col-value{font-family:var(--font-mono);font-size:17px;font-weight:600;}
  .section-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--dim);
    text-transform:uppercase;margin:6px 0 12px;}
  .empty-note{font-size:13px;color:var(--dim);padding:8px 0 20px;line-height:1.5;}
  .cat-list{display:flex;flex-direction:column;gap:14px;margin-bottom:28px;}
  .cat-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .cat-name{color:#B8BEC7;}
  .cat-value{font-family:var(--font-mono);color:var(--text);}
  .cat-bar-track{height:5px;background:#1F2730;border-radius:3px;overflow:hidden;}
  .cat-bar-fill{height:100%;background:var(--gold);border-radius:3px;}
  .loan-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .loan-summary-row{display:flex;justify-content:space-between;align-items:center;}
  .tx-list{display:flex;flex-direction:column;}
  .tx-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1A2129;}
  .tx-dot{width:8px;height:8px;border-radius:4px;flex-shrink:0;}
  .tx-info{flex:1;min-width:0;}
  .tx-desc{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-meta{font-size:11px;color:var(--dim);margin-top:2px;}
  .tx-amount{font-family:var(--font-mono);font-size:15px;}
  .trash-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--dim);font-size:15px;}
  .loan-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;
    margin-bottom:14px;display:flex;flex-direction:column;gap:10px;}
  .loan-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .loan-borrower{font-family:var(--font-display);font-size:17px;font-weight:600;}
  .loan-borrower.owed{color:var(--red);}
  .loan-borrower.paid{color:var(--green);}
  .small-btn{background:#1F2730;border:1px solid var(--border);color:var(--gold);font-size:11px;
    padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .small-btn:disabled{opacity:.5;cursor:default;color:var(--green);}
  .paid-badge{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--green);
    background:#17251F;border:1px solid #274A3B;padding:4px 8px;border-radius:8px;white-space:nowrap;}
  .overdue-badge{align-self:flex-start;font-size:11px;color:var(--red);background:#3A2323;
    border:1px solid #5A3333;padding:4px 8px;border-radius:8px;}
  .trash-btn-loan{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--dim);
    font-size:12px;cursor:pointer;align-self:flex-end;padding:2px 0;}
  .fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:calc(50% - 240px + 20px);
    background:var(--gold);width:52px;height:52px;border-radius:26px;border:none;display:flex;
    align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(201,161,90,.35);
    font-size:26px;color:#0F1419;line-height:1;}
  @media (max-width:520px){ .fab{right:20px;} }
  .tabbar{display:flex;border-top:1px solid #1F2730;background:var(--bg);position:sticky;bottom:0;
    padding-bottom:env(safe-area-inset-bottom);}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;
    background:none;border:none;cursor:pointer;color:var(--dim);font-family:var(--font-body);}
  .tab-btn.active{color:var(--gold);}
  .tab-btn .ic{font-size:19px;}
  .tab-label{font-size:10px;letter-spacing:.03em;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;
    justify-content:center;z-index:30;}
  .sheet{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;
    max-width:480px;padding:10px 20px calc(28px + env(safe-area-inset-bottom));max-height:88vh;
    overflow-y:auto;border:1px solid var(--border);border-bottom:none;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:6px auto 14px;}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-title{font-family:var(--font-display);font-size:19px;font-weight:600;}
  .segmented{display:flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:16px;
    border:1px solid var(--border);}
  .seg-btn{flex:1;padding:9px 0;border-radius:8px;border:none;background:none;color:var(--muted);
    font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-body);}
  .seg-btn.active-expense{background:#3A2323;color:var(--red);}
  .seg-btn.active-income{background:#17251F;color:var(--green);}
  .seg-btn.active-gold{background:#2A2417;color:var(--gold);}
  label.field-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    display:block;margin:14px 0 6px;}
  input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;color:var(--text);font-size:15px;font-family:var(--font-body);}
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .save-btn{width:100%;background:var(--gold);border:none;border-radius:12px;padding:14px 0;color:#0F1419;
    font-size:15px;font-weight:600;margin-top:22px;cursor:pointer;font-family:var(--font-body);}
  .save-btn:disabled{opacity:.5;}
  .error-banner{background:#3A2323;color:var(--red);font-size:13px;padding:8px 20px;}
  .info-banner{background:#2A2417;color:var(--gold);font-size:12px;padding:8px 20px;text-align:center;}

  /* ---- login / gate screens ---- */
  .gate-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:6px;}
  .gate-title{font-family:var(--font-display);font-size:26px;font-weight:600;text-align:center;margin-bottom:4px;}
  .gate-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;}
  .gate-btn{width:100%;background:var(--gold);border:none;border-radius:12px;padding:14px 0;color:#0F1419;
    font-size:15px;font-weight:600;margin-top:18px;cursor:pointer;}
  .gate-btn:disabled{opacity:.5;}
  .link-btn{background:none;border:none;color:var(--dim);font-size:12px;text-decoration:underline;
    cursor:pointer;margin-top:14px;align-self:center;}

  /* ---- admin tab ---- */
  .user-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
    margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .user-name{font-weight:600;font-size:15px;}
  .user-role{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .toggle{position:relative;width:44px;height:26px;border-radius:13px;background:#3A2323;border:1px solid var(--border);
    cursor:pointer;flex-shrink:0;}
  .toggle.on{background:#17251F;border-color:#274A3B;}
  .toggle-dot{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:var(--red);
    transition:transform .15s ease;}
  .toggle.on .toggle-dot{transform:translateX(18px);background:var(--green);}
  .user-actions{display:flex;gap:8px;align-items:center;}
  .user-perms{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #1A2129;}
  .user-perm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .user-perm-label{font-size:12px;color:var(--muted);}
  .viewing-banner{background:var(--surface2);border:1px solid var(--gold);color:var(--gold);font-size:12px;
    padding:10px 14px;border-radius:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}

  /* ---- previsão / forecast tab ---- */
  .rec-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
    margin-bottom:12px;display:flex;flex-direction:column;gap:8px;}
  .rec-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .rec-desc{font-size:15px;font-weight:600;}
  .rec-meta{font-size:11px;color:var(--dim);}
  .rec-actions{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .chart-wrap{position:relative;height:220px;margin-bottom:28px;}
  .chart-wrap.tall{height:240px;}
  .vehicle-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
    margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .vehicle-model{font-weight:600;font-size:15px;}
  .vehicle-plate{font-size:11px;color:var(--dim);font-family:var(--font-mono);margin-top:2px;}
  .status-pill{font-size:10px;padding:4px 10px;border-radius:8px;white-space:nowrap;cursor:pointer;letter-spacing:.02em;}
  .status-pill.alugado{background:#17251F;color:var(--green);border:1px solid #274A3B;}
  .status-pill.disponivel{background:#1B2A3A;color:#8FB4D9;border:1px solid #2C4459;}
  .status-pill.manutencao{background:#3A2323;color:var(--red);border:1px solid #5A3333;}
</style>

<script>
'use strict';

// =====================================================================
// CONFIGURAÇÃO DO FIREBASE — troque pelos dados do SEU projeto Firebase
// (Console Firebase > Configurações do projeto > Seus apps > Config)
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBMOCKuB98P_k3CrI8PAKax_qHVbxSQXss",
  authDomain: "gest-72c81.firebaseapp.com",
  projectId: "gest-72c81",
  storageBucket: "gest-72c81.firebasestorage.app",
  messagingSenderId: "170064402796",
  appId: "1:170064402796:web:5d89380fa6576e72bfbb49"
};
const EMAIL_DOMAIN = 'gestaodopadrinho.app'; // domínio interno fictício p/ converter usuário -> email

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---------- helpers ----------
const fmt = n => (n||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const monthLabel = d => d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
const isSameMonth = (iso, ref) => {
  const d = new Date(iso+'T00:00:00');
  return d.getMonth()===ref.getMonth() && d.getFullYear()===ref.getFullYear();
};
const monthsElapsed = (startISO, endDate) => {
  const start = new Date(startISO+'T00:00:00');
  const days = Math.floor((endDate-start)/86400000);
  return Math.max(0, Math.floor(days/30));
};
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const todayISO = () => new Date().toISOString().slice(0,10);
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth()+n); return r; };
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const escapeHtml = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showError(msg){
  const el = document.getElementById('errorBanner');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 4000);
}
function showToast(msg){
  const el = document.getElementById('toastBanner');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 2500);
}
function usernameToEmail(u){ return `${u.trim().toLowerCase()}@${EMAIL_DOMAIN}`; }

const CATS_EXPENSE = ['Moradia','Alimentação','Transporte','Saúde','Lazer','Contas','Empréstimo','Outros'];
const CATS_INCOME = ['Salário','Freelance','Rendimentos','Empréstimo recebido','Outros'];

// ---------- tipos de receita previsível ----------
const TIPOS_RECEITA = {
  frota:    { label: 'Frota de carros',       color: '#7FBFA6' },
  pix:      { label: 'Venda parcelada (Pix)', color: '#C9A15A' },
  salario:  { label: 'Salário',               color: '#8FB4D9' },
  negocio:  { label: 'Negócios',               color: '#D9A8D9' },
  outro:    { label: 'Outro',                 color: '#B8BEC7' },
};
const DIAS_SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function tipoInfo(item){
  if(item.direcao === 'saida') return { label: item.categoria || 'Gasto fixo', color: '#D98A8E' };
  return TIPOS_RECEITA[item.tipo] || TIPOS_RECEITA.outro;
}

// ---------- loan helpers ----------
function normalizeLoan(l){
  return Object.assign({
    calcMode: 'rate', rate: 0, compound: false, expectedAmount: null,
    dueDate: null, lateFee: { mode: 'fixed', value: 0 },
    jurosTotal: 0, numParcelas: null, parcelasPagasCount: 0, primeiraParcelaData: null,
  }, l);
}
function computeLoanAmounts(l, asOfDate){
  if(l.calcMode === 'parcelado'){
    const baseTotal = l.principal + (l.jurosTotal||0);
    const valorParcela = baseTotal / (l.numParcelas||1);
    return { baseTotal, juros: l.jurosTotal||0, daysLate: 0, lateFeeTotal: 0, total: baseTotal, valorParcela };
  }
  let baseTotal;
  if(l.calcMode === 'fixed'){
    baseTotal = (l.expectedAmount != null) ? l.expectedAmount : l.principal;
  }else{
    const m = monthsElapsed(l.startDate, asOfDate);
    const juros = l.compound ? l.principal*(Math.pow(1+l.rate/100,m)-1) : l.principal*(l.rate/100)*m;
    baseTotal = l.principal + juros;
  }
  let daysLate = 0, lateFeeTotal = 0;
  if(l.dueDate){
    const due = midnight(new Date(l.dueDate+'T00:00:00'));
    const ref = midnight(asOfDate);
    if(ref > due){
      daysLate = Math.round((ref-due)/86400000);
      const feeVal = (l.lateFee && l.lateFee.value) || 0;
      if(feeVal > 0){
        lateFeeTotal = (l.lateFee.mode === 'percent')
          ? baseTotal * (feeVal/100) * daysLate
          : feeVal * daysLate;
      }
    }
  }
  return { baseTotal, juros: baseTotal - l.principal, daysLate, lateFeeTotal, total: baseTotal + lateFeeTotal };
}

// ---------- recorrência / previsão helpers ----------
function normalizeRecurrence(r){
  return Object.assign({
    tipo: 'outro', descricao: '', valor: 0, frequencia: 'semanal',
    diaSemana: 1, diaMes: 1, dataInicio: todayISO(),
    parcelasTotal: null, ativo: true, receivedDates: [],
    direcao: 'entrada', categoria: '',
  }, r);
}
// gera as ocorrências de uma recorrência dentro de uma janela [hoje-lookbackDays, hoje+forwardDays]
function nextOccurrences(rec, lookbackDays, forwardDays){
  if(rec.ativo === false) return [];
  const hoje = midnight(new Date());
  const rangeStart = addDays(hoje, -lookbackDays);
  const rangeEnd = addDays(hoje, forwardDays);
  const inicio = midnight(new Date(rec.dataInicio+'T00:00:00'));
  const out = [];

  if(rec.frequencia === 'semanal'){
    let cursor = new Date(inicio);
    while(cursor.getDay() !== Number(rec.diaSemana)) cursor = addDays(cursor, 1);
    while(cursor <= rangeEnd){
      if(cursor >= rangeStart) out.push({ date: toISO(cursor) });
      cursor = addDays(cursor, 7);
    }
  }else if(rec.frequencia === 'mensal'){
    let cursor = new Date(inicio.getFullYear(), inicio.getMonth(), Math.min(rec.diaMes, 28));
    if(cursor < inicio) cursor = addMonths(cursor, 1);
    while(cursor <= rangeEnd){
      if(cursor >= rangeStart) out.push({ date: toISO(cursor) });
      cursor = addMonths(cursor, 1);
    }
  }else if(rec.frequencia === 'parcelas'){
    const total = rec.parcelasTotal||0;
    const recebidas = rec.receivedDates||[];
    for(let i=0;i<total;i++){
      const d = addMonths(inicio, i);
      const dateStr = toISO(d);
      if(!recebidas.includes(dateStr)){
        if(d <= rangeEnd) out.push({ date: dateStr, parcelaNum: i+1 }); // só entra se já venceu ou vence até o fim da janela vista
        break; // só a parcela atual pendente — nunca acumula parcelas atrasadas
      }
    }
  }
  return out;
}
function buildForecast(recurrences, lookbackDays, forwardDays){
  const items = [];
  recurrences.map(normalizeRecurrence).forEach(rec => {
    nextOccurrences(rec, lookbackDays, forwardDays).forEach(occ => {
      items.push({
        date: occ.date,
        tipo: rec.tipo,
        valor: rec.valor,
        descricao: rec.descricao,
        recId: rec.id,
        parcelaNum: occ.parcelaNum,
        parcelasTotal: rec.parcelasTotal,
        received: (rec.receivedDates||[]).includes(occ.date),
        direcao: rec.direcao,
        categoria: rec.categoria,
      });
    });
  });
  items.sort((a,b)=> a.date < b.date ? -1 : 1);
  return items;
}

// ---------- charts ----------
const CHART_COLORS = ['#C9A15A','#7FBFA6','#D98A8E','#8FB4D9','#D9A8D9','#889099','#E0C68A','#5FA88F'];
const chartInstances = {};
function destroyChart(id){
  if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; }
}
function makeDoughnut(canvasId, labels, data, colors){
  destroyChart(canvasId);
  const el = document.getElementById(canvasId);
  if(!el || labels.length===0) return;
  chartInstances[canvasId] = new Chart(el, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: { legend: { position: 'bottom', labels: { color: '#B8BEC7', font: { size: 11 }, boxWidth: 10, padding: 12 } } }
    }
  });
}
function makeBar(canvasId, labels, datasets, stacked){
  destroyChart(canvasId);
  const el = document.getElementById(canvasId);
  if(!el) return;
  chartInstances[canvasId] = new Chart(el, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      maintainAspectRatio: false,
      scales: {
        x: { stacked: !!stacked, ticks: { color: '#889099', font: { size: 11 } }, grid: { color: '#1A2129' } },
        y: { stacked: !!stacked, ticks: { color: '#889099', font: { size: 11 } }, grid: { color: '#1A2129' } }
      },
      plugins: { legend: { display: datasets.length>1, position: 'bottom', labels: { color: '#B8BEC7', font: { size: 11 } } } }
    }
  });
}
function renderCharts(){
  if(state.tab === 'resumo') renderResumoCharts();
  else if(state.tab === 'previsao') renderPrevisaoCharts();
}
function renderResumoCharts(){
  const refMonth = state.refMonth;
  const monthTx = state.data.transactions.filter(t => isSameMonth(t.date, refMonth));
  const byCat = {};
  monthTx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  makeDoughnut('chartGastos', catEntries.map(e=>e[0]), catEntries.map(e=>e[1]), CHART_COLORS);

  // últimos 6 meses: entradas vs saídas
  const months = [];
  for(let i=5;i>=0;i--) months.push(addMonths(new Date(refMonth), -i));
  const labels = months.map(m=>m.toLocaleDateString('pt-BR',{month:'short'}));
  const incomeData = months.map(m => state.data.transactions.filter(t=>t.type==='income' && isSameMonth(t.date,m)).reduce((s,t)=>s+t.amount,0));
  const expenseData = months.map(m => state.data.transactions.filter(t=>t.type==='expense' && isSameMonth(t.date,m)).reduce((s,t)=>s+t.amount,0));
  makeBar('chartTendencia', labels, [
    { label: 'Entradas', data: incomeData, backgroundColor: '#7FBFA6' },
    { label: 'Saídas', data: expenseData, backgroundColor: '#D98A8E' },
  ]);
}
function renderPrevisaoCharts(){
  const recs = state.data.recurrences.map(normalizeRecurrence);
  const forwardDays = daysLeftInMonth();
  const forecast = buildForecast(recs, LOOKBACK_DAYS, forwardDays);
  const pendentes = forecast.filter(i=>!i.received && i.direcao!=='saida');
  const byTipo = {};
  pendentes.forEach(i=>{ byTipo[i.tipo] = (byTipo[i.tipo]||0) + i.valor; });
  const tipoEntries = Object.entries(byTipo).sort((a,b)=>b[1]-a[1]);
  makeDoughnut('chartPrevisaoTipo',
    tipoEntries.map(([t])=>TIPOS_RECEITA[t].label),
    tipoEntries.map(([,v])=>v),
    tipoEntries.map(([t])=>TIPOS_RECEITA[t].color));

  // agrupado por semana, dentro do mês atual (só entradas ainda não recebidas)
  const hoje = midnight(new Date());
  const numSemanas = Math.max(1, Math.ceil(forwardDays/7));
  const semanaLabels = [];
  const semanaTotais = [];
  for(let i=0;i<numSemanas;i++){
    const inicioSemana = addDays(hoje, i*7);
    const fimSemana = addDays(hoje, i*7+6);
    const total = pendentes.filter(f=>{
      const d = midnight(new Date(f.date+'T00:00:00'));
      return d >= inicioSemana && d <= fimSemana;
    }).reduce((s,f)=>s+f.valor,0);
    semanaLabels.push(`${inicioSemana.getDate()}/${inicioSemana.getMonth()+1}`);
    semanaTotais.push(total);
  }
  makeBar('chartPrevisaoSemanal', semanaLabels, [{ label: 'Previsto', data: semanaTotais, backgroundColor: '#C9A15A' }]);
}

auth.onAuthStateChanged(async (user) => {
  detachListeners();
  if(!user){
    state.currentUser = null;
    renderLoginScreen();
    return;
  }
  try{
    const snap = await db.collection('users').doc(user.uid).get();
    if(!snap.exists){
      showError('Conta sem cadastro. Fale com o administrador.');
      auth.signOut();
      return;
    }
    const profile = snap.data();
    if(profile.active === false){
      renderDisabledScreen(profile.username || user.email);
      return;
    }
    const isAdmin = (profile.role || 'user') === 'admin';
    const canLoans = isAdmin ? true : profile.canLoans === true;
    state.currentUser = { uid: user.uid, username: profile.username, role: profile.role || 'user', canLoans };
    state.viewingUid = user.uid;
    state.viewingUsername = profile.username;
    document.getElementById('tabUsuarios').style.display = isAdmin ? '' : 'none';
    document.getElementById('tabEmprestimos').style.display = canLoans ? '' : 'none';
    if(!canLoans && state.tab === 'emprestimos') state.tab = 'resumo';
    showApp(true);
    attachDataListeners(state.viewingUid);
    if(isAdmin) attachUsersListener();
    render();
  }catch(e){
    showError('Erro ao carregar conta: ' + e.message);
  }
});

function detachListeners(){
  if(state.unsubTx) state.unsubTx();
  if(state.unsubLoans) state.unsubLoans();
  if(state.unsubUsers) state.unsubUsers();
  if(state.unsubRec) state.unsubRec();
  state.unsubTx = state.unsubLoans = state.unsubUsers = state.unsubRec = null;
  if(state.unsubVehicles) state.unsubVehicles();
  state.unsubVehicles = null;
}

function attachDataListeners(uid){
  if(state.unsubTx) state.unsubTx();
  if(state.unsubLoans) state.unsubLoans();
  if(state.unsubRec) state.unsubRec();
  state.unsubTx = db.collection('users').doc(uid).collection('transactions')
    .onSnapshot(qs => {
      state.data.transactions = qs.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => showError('Erro ao carregar lançamentos: '+err.message));
  state.unsubLoans = db.collection('users').doc(uid).collection('loans')
    .onSnapshot(qs => {
      state.data.loans = qs.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => showError('Erro ao carregar empréstimos: '+err.message));
  state.unsubRec = db.collection('users').doc(uid).collection('recurrences')
    .onSnapshot(qs => {
      state.data.recurrences = qs.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => showError('Erro ao carregar previsões: '+err.message));
  if(state.unsubVehicles) state.unsubVehicles();
  state.unsubVehicles = db.collection('users').doc(uid).collection('vehicles')
    .onSnapshot(qs => {
      state.data.vehicles = qs.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => showError('Erro ao carregar frota: '+err.message));
}

function attachUsersListener(){
  if(state.unsubUsers) state.unsubUsers();
  state.unsubUsers = db.collection('users').onSnapshot(qs => {
    state.allUsers = qs.docs.map(d => ({ uid: d.id, ...d.data() }));
    if(state.tab === 'usuarios') render();
  }, err => showError('Erro ao carregar usuários: '+err.message));
}

function switchViewing(uid, username){
  state.viewingUid = uid;
  state.viewingUsername = username;
  attachDataListeners(uid);
  state.tab = 'resumo';
  render();
}

function dataCol(name){

}
function addTransaction(tx){ return dataCol('transactions').add(tx).catch(e=>showError('Erro ao salvar: '+e.message)); }
function deleteTransaction(id){ return dataCol('transactions').doc(id).delete().catch(e=>showError('Erro ao excluir: '+e.message)); }
function addLoan(loan){ return dataCol('loans').add(loan).catch(e=>showError('Erro ao salvar: '+e.message)); }
function updateLoan(id, patch){ return dataCol('loans').doc(id).update(patch).catch(e=>showError('Erro ao atualizar: '+e.message)); }
function deleteLoan(id){ return dataCol('loans').doc(id).delete().catch(e=>showError('Erro ao excluir: '+e.message)); }
function registrarParcelaEmprestimo(loanId){
  const loan = state.data.loans.find(l=>l.id===loanId);
  if(!loan) return;
  const l = normalizeLoan(loan);
  const { valorParcela } = computeLoanAmounts(l, new Date());
  const proximaParcela = (l.parcelasPagasCount||0) + 1;
  const patch = { parcelasPagasCount: proximaParcela };
  if(proximaParcela >= l.numParcelas){
    patch.status = 'paid';
    patch.paidDate = todayISO();
  }
  updateLoan(loanId, patch);
  addTransaction({
    type: 'income',
    description: `Parcela ${proximaParcela}/${l.numParcelas} recebida - ${loan.borrower}`,
    amount: valorParcela,
    category: 'Rendimentos',
    date: todayISO(),
  });
  showToast(`✓ ${fmt(valorParcela)} — parcela ${proximaParcela}/${l.numParcelas}`);
}
function addRecurrence(rec){ return dataCol('recurrences').add(rec).catch(e=>showError('Erro ao salvar: '+e.message)); }
function updateRecurrence(id, patch){ return dataCol('recurrences').doc(id).update(patch).catch(e=>showError('Erro ao atualizar: '+e.message)); }
function deleteRecurrence(id){ return dataCol('recurrences').doc(id).delete().catch(e=>showError('Erro ao excluir: '+e.message)); }
function addVehicle(v){ return dataCol('vehicles').add(v).catch(e=>showError('Erro ao salvar: '+e.message)); }
function updateVehicle(id, patch){ return dataCol('vehicles').doc(id).update(patch).catch(e=>showError('Erro ao atualizar: '+e.message)); }
function deleteVehicle(id){ return dataCol('vehicles').doc(id).delete().catch(e=>showError('Erro ao excluir: '+e.message)); }
function toggleOccurrence(recId, date, valor, currentlyReceived){
  const rec = state.data.recurrences.find(r=>r.id===recId);
  if(!rec) return;
  const op = currentlyReceived
    ? firebase.firestore.FieldValue.arrayRemove(date)
    : firebase.firestore.FieldValue.arrayUnion(date);
  dataCol('recurrences').doc(recId).update({ receivedDates: op })
    .catch(e=>showError('Erro ao atualizar: '+e.message));
  const isSaida = rec.direcao === 'saida';
  if(!currentlyReceived){
    addTransaction(isSaida ? {
      type: 'expense',
      description: rec.descricao || rec.categoria || 'Gasto fixo',
      amount: valor,
      category: rec.categoria || 'Outros',
      date,
    } : {
      type: 'income',
      description: rec.descricao || TIPOS_RECEITA[rec.tipo].label,
      amount: valor,
      category: 'Rendimentos',
      date,
    });
    showToast(isSaida ? `✓ ${fmt(valor)} marcado como pago` : `✓ ${fmt(valor)} marcado como recebido`);
  }else{
    showToast('Marcado como pendente novamente');
  }
}

// ---------- Previsão (dashboard de previsibilidade) ----------
const LOOKBACK_DAYS = 60;
function daysLeftInMonth(){
  const hoje = midnight(new Date());
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  return Math.round((ultimoDia - hoje) / 86400000);
}
function renderPrevisao(){
  const recs = state.data.recurrences.map(normalizeRecurrence);
  const forecast = buildForecast(recs, LOOKBACK_DAYS, daysLeftInMonth());
  const hoje = midnight(new Date());

  const pendentes = forecast.filter(i=>!i.received);
  const entradaPend = pendentes.filter(i=>i.direcao!=='saida');
  const saidaPend = pendentes.filter(i=>i.direcao==='saida');

  const entradaAtrasada = entradaPend.filter(i=> midnight(new Date(i.date+'T00:00:00')) < hoje);
  const entradaFutura = entradaPend.filter(i=> midnight(new Date(i.date+'T00:00:00')) >= hoje);
  const saidaAtrasada = saidaPend.filter(i=> midnight(new Date(i.date+'T00:00:00')) < hoje);
  const saidaFutura = saidaPend.filter(i=> midnight(new Date(i.date+'T00:00:00')) >= hoje);

  const totalEntradaFutura = entradaFutura.reduce((s,i)=>s+i.valor,0);
  const totalEntradaAtrasada = entradaAtrasada.reduce((s,i)=>s+i.valor,0);
  const totalSaidaFutura = saidaFutura.reduce((s,i)=>s+i.valor,0);
  const totalSaidaAtrasada = saidaAtrasada.reduce((s,i)=>s+i.valor,0);
  const saldoPrevisto = totalEntradaFutura - totalSaidaFutura;

  const byTipo = {};
  entradaPend.forEach(i=>{ byTipo[i.tipo] = (byTipo[i.tipo]||0) + i.valor; });
  const maxTipo = Math.max(1, ...Object.values(byTipo));
  const tipoEntries = Object.entries(byTipo).sort((a,b)=>b[1]-a[1]);

  const ativos = recs.filter(r=>r.ativo!==false);
  const inativos = recs.filter(r=>r.ativo===false);

  return `
    <div class="balance-card">
      <div class="balance-eyebrow">saldo previsto — ${monthLabel(new Date())}</div>
      <div class="balance-number" style="color:${saldoPrevisto>=0?'#7FBFA6':'#D98A8E'}">${fmt(saldoPrevisto)}</div>
      <div class="balance-divider"></div>
      <div class="balance-row">
        <div class="balance-col">
          <span class="balance-col-label">↑ Entradas pendentes</span>
          <span class="balance-col-value" style="color:#7FBFA6">${fmt(totalEntradaFutura)}</span>
        </div>
        <div class="balance-col-divider"></div>
        <div class="balance-col">
          <span class="balance-col-label">↓ Saídas pendentes</span>
          <span class="balance-col-value" style="color:#D98A8E">${fmt(totalSaidaFutura)}</span>
        </div>
      </div>
      ${(totalEntradaAtrasada>0 || totalSaidaAtrasada>0) ? `<div class="empty-note" style="color:var(--red);padding-top:14px;">⚠ ${totalEntradaAtrasada>0?`${fmt(totalEntradaAtrasada)} a receber atrasado`:''}${(totalEntradaAtrasada>0&&totalSaidaAtrasada>0)?' · ':''}${totalSaidaAtrasada>0?`${fmt(totalSaidaAtrasada)} a pagar atrasado`:''}</div>` : ''}
    </div>

    <div class="section-title">por tipo de entrada (pendente)</div>
    ${tipoEntries.length===0 ? '<div class="empty-note">Nenhuma entrada pendente. Toque em + para cadastrar uma fonte de renda recorrente.</div>' : `
    <div class="chart-wrap"><canvas id="chartPrevisaoTipo"></canvas></div>
    <div class="cat-list">
      ${tipoEntries.map(([tipo,val])=>`
        <div>
          <div class="cat-row-top"><span class="cat-name">${TIPOS_RECEITA[tipo].label}</span><span class="cat-value">${fmt(val)}</span></div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(val/maxTipo)*100}%;background:${TIPOS_RECEITA[tipo].color}"></div></div>
        </div>
      `).join('')}
    </div>`}

    <div class="section-title">previsão por semana</div>
    <div class="chart-wrap"><canvas id="chartPrevisaoSemanal"></canvas></div>

    <div class="section-title">pendências</div>
    ${(() => {
      const nextByRec = {};
      pendentes.forEach(i=>{
        if(!nextByRec[i.recId] || i.date < nextByRec[i.recId].date) nextByRec[i.recId] = i;
      });
      const proximos = Object.values(nextByRec).sort((a,b)=> a.date < b.date ? -1 : 1);
      if(proximos.length===0) return '<div class="empty-note">Tudo em dia — nenhuma pendência no momento.</div>';
      return `<div class="tx-list" style="margin-bottom:28px;">
        ${proximos.map(i=>{
          const overdue = midnight(new Date(i.date+'T00:00:00')) < hoje;
          const isSaida = i.direcao === 'saida';
          const pillClass = overdue ? 'manutencao' : 'disponivel';
          const pillLabel = overdue ? 'Atrasado' : (isSaida ? 'A pagar' : 'Pendente');
          const info = tipoInfo(i);
          return `
          <div class="tx-row">
            <div class="tx-dot" style="background:${info.color}"></div>
            <div class="tx-info">
              <div class="tx-desc">${escapeHtml(i.descricao) || info.label}${i.parcelaNum ? ` (parcela ${i.parcelaNum}/${i.parcelasTotal})` : ''}</div>
              <div class="tx-meta">${info.label} · ${new Date(i.date+'T00:00:00').toLocaleDateString('pt-BR')}</div>
            </div>
            <div class="tx-amount" style="color:${isSaida?'var(--red)':'var(--green)'}">${isSaida?'-':'+'} ${fmt(i.valor)}</div>
            <span class="status-pill ${pillClass}" data-toggle-occ="${i.recId}" data-occ-date="${i.date}" data-occ-valor="${i.valor}" data-occ-received="false">${pillLabel}</span>
          </div>
        `;}).join('')}
      </div>`;
    })()}

    <div class="section-title">fontes cadastradas</div>
    ${ativos.length===0 && inativos.length===0 ? '<div class="empty-note">Nenhuma fonte cadastrada ainda.</div>' : ''}
    ${ativos.map(recCardHtml).join('')}
    ${inativos.length>0 ? inativos.map(recCardHtml).join('') : ''}
  `;
}
function renderFrota(){

    <div class="section-title">sua frota</div>

function vehicleCardHtml(v){

function recCardHtml(r){
  const freqLabel = r.frequencia === 'semanal' ? `Toda ${DIAS_SEMANA[r.diaSemana].toLowerCase()}`
    : r.frequencia === 'mensal' ? `Todo dia ${r.diaMes}`
    : `Parcelado (${(r.receivedDates||[]).length}/${r.parcelasTotal} pagas)`;
  const veiculo = r.veiculoId ? state.data.vehicles.find(v=>v.id===r.veiculoId) : null;
  const info = tipoInfo(r);
  const isSaida = r.direcao === 'saida';
  return `
    <div class="rec-card" style="opacity:${r.ativo===false?0.5:1}">
      <div class="rec-card-top">
        <div>
          <div class="rec-desc">${escapeHtml(r.descricao) || info.label}</div>
          <div class="rec-meta">${info.label}${veiculo ? ` · ${escapeHtml(veiculo.placa||veiculo.modelo)}` : ''} · ${freqLabel} · ${isSaida?'-':'+'} ${fmt(r.valor)}</div>
        </div>
        <div class="toggle ${r.ativo!==false?'on':''}" data-toggle-rec="${r.id}" data-current="${r.ativo!==false}"><div class="toggle-dot"></div></div>
      </div>
      <div class="rec-actions">
        <span></span>
        <button class="trash-btn-loan" data-delete-rec="${r.id}">✕ excluir</button>
      </div>
    </div>
  `;
}

// ---------- Empréstimos ----------
function loanCardHtml(l){
  const isPaid = l.status === 'paid';
  if(l.calcMode === 'parcelado'){
    const { juros, total, valorParcela } = computeLoanAmounts(l, new Date());
    const pagas = l.parcelasPagasCount||0;
    const restante = (l.numParcelas||0) - pagas;
    const proximaData = l.primeiraParcelaData ? addMonths(midnight(new Date(l.primeiraParcelaData+'T00:00:00')), pagas) : null;
    return `
    <div class="loan-card">
      <div class="loan-card-top">
        <div class="loan-borrower ${isPaid ? 'paid' : 'owed'}">${escapeHtml(l.borrower)}</div>
        ${isPaid ? '<span class="paid-badge">✓ quitado</span>' : `<button class="small-btn" data-registrar-parcela="${l.id}">Registrar parcela</button>`}
      </div>
      <div class="loan-summary-row"><span class="balance-col-label">Capital</span><span style="font-family:var(--font-mono);font-size:15px;">${fmt(l.principal)}</span></div>
      <div class="loan-summary-row"><span class="balance-col-label">Juros total</span><span style="font-family:var(--font-mono);font-size:15px;color:var(--gold);">${fmt(juros)}</span></div>
      <div class="loan-summary-row"><span class="balance-col-label">Parcelas</span><span style="font-family:var(--font-mono);font-size:15px;">${pagas}/${l.numParcelas} · ${fmt(valorParcela)} cada</span></div>
      ${!isPaid && proximaData ? `<div class="loan-summary-row"><span class="balance-col-label">Próxima parcela</span><span style="font-family:var(--font-mono);font-size:15px;">${proximaData.toLocaleDateString('pt-BR')}</span></div>` : ''}
      <div class="loan-summary-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:2px;">
        <span class="balance-col-label" style="color:var(--text)">Total (${l.numParcelas}x)</span>
        <span style="font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--gold);">${fmt(total)}</span>
      </div>
      <button class="trash-btn-loan" data-delete-loan="${l.id}">✕ excluir</button>
    </div>
  `;
  }
  const { juros, lateFeeTotal, daysLate, total } = computeLoanAmounts(l, isPaid ? new Date(l.paidDate+'T00:00:00') : new Date());
  return `
    <div class="loan-card">
      <div class="loan-card-top">
        <div class="loan-borrower ${isPaid ? 'paid' : 'owed'}">${escapeHtml(l.borrower)}</div>
        ${isPaid ? '<span class="paid-badge">✓ quitado</span>' : `<button class="small-btn" data-mark-paid="${l.id}">Dar baixa</button>`}
      </div>
      ${(!isPaid && daysLate>0) ? `<span class="overdue-badge">⚠ ${daysLate} dia${daysLate>1?'s':''} de atraso</span>` : ''}
      <div class="loan-summary-row"><span class="balance-col-label">Capital</span><span style="font-family:var(--font-mono);font-size:15px;">${fmt(l.principal)}</span></div>
      <div class="loan-summary-row"><span class="balance-col-label">Juros</span><span style="font-family:var(--font-mono);font-size:15px;color:var(--gold);">${fmt(juros)}</span></div>
      ${lateFeeTotal>0 ? `<div class="loan-summary-row"><span class="balance-col-label" style="color:var(--red)">Multa por atraso</span><span style="font-family:var(--font-mono);font-size:15px;color:var(--red);">${fmt(lateFeeTotal)}</span></div>` : ''}
      <div class="loan-summary-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:2px;">
        <span class="balance-col-label" style="color:var(--text)">Total</span>
        <span style="font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--gold);">${fmt(total)}</span>
      </div>
      <button class="trash-btn-loan" data-delete-loan="${l.id}">✕ excluir</button>
    </div>
  `;
}
function renderEmprestimos(){
  const loans = state.data.loans.map(normalizeLoan);
  const active = loans.filter(l=>l.status!=='paid');

}

// ---------- listeners for rendered content ----------
function attachMainListeners(){
  const prev = document.getElementById('prevMonth');
  const next = document.getElementById('nextMonth');
  if(prev) prev.onclick = () => { shiftMonth(-1); };
  if(next) next.onclick = () => { shiftMonth(1); };

  const backBtn = document.getElementById('backToMine');
  if(backBtn) backBtn.onclick = () => switchViewing(state.currentUser.uid, state.currentUser.username);

  document.querySelectorAll('[data-delete-tx]').forEach(btn=>{
    btn.onclick = () => deleteTransaction(btn.getAttribute('data-delete-tx'));
  });
  document.querySelectorAll('[data-mark-paid]').forEach(btn=>{
    btn.onclick = () => openMarkPaidForm(btn.getAttribute('data-mark-paid'));
  });
  document.querySelectorAll('[data-registrar-parcela]').forEach(btn=>{
    btn.onclick = () => registrarParcelaEmprestimo(btn.getAttribute('data-registrar-parcela'));
  });
  document.querySelectorAll('[data-delete-loan]').forEach(btn=>{
    btn.onclick = () => deleteLoan(btn.getAttribute('data-delete-loan'));
  });

  // previsão
  document.querySelectorAll('[data-delete-rec]').forEach(btn=>{
    btn.onclick = () => deleteRecurrence(btn.getAttribute('data-delete-rec'));
  });
  document.querySelectorAll('[data-toggle-rec]').forEach(el=>{
    el.onclick = () => {
      const id = el.getAttribute('data-toggle-rec');
      const current = el.getAttribute('data-current') === 'true';
      updateRecurrence(id, { ativo: !current });
    };
  });
  document.querySelectorAll('[data-toggle-occ]').forEach(el=>{
    el.onclick = () => {
      const received = el.getAttribute('data-occ-received') === 'true';
      toggleOccurrence(
        el.getAttribute('data-toggle-occ'),
        el.getAttribute('data-occ-date'),
        parseFloat(el.getAttribute('data-occ-valor')),
        received
      );
    };
  });
  const addVehicleBtn = document.getElementById('openAddVehicle');
  if(addVehicleBtn) addVehicleBtn.onclick = openVehicleForm;
  document.querySelectorAll('[data-delete-vehicle]').forEach(btn=>{
    btn.onclick = () => deleteVehicle(btn.getAttribute('data-delete-vehicle'));
  });
  document.querySelectorAll('[data-cycle-status]').forEach(el=>{
    el.onclick = () => {
      const order = ['disponivel','alugado','manutencao'];
      const id = el.getAttribute('data-cycle-status');
      const current = el.getAttribute('data-current');
      const next = order[(order.indexOf(current)+1) % order.length];
      updateVehicle(id, { status: next });
    };
  });

  // admin: usuários
  document.querySelectorAll('[data-view-user]').forEach(btn=>{
    btn.onclick = () => switchViewing(btn.getAttribute('data-view-user'), btn.getAttribute('data-view-username'));
  });
  document.querySelectorAll('[data-toggle-active]').forEach(el=>{
    el.onclick = () => {
      const uid = el.getAttribute('data-toggle-active');
      const current = el.getAttribute('data-current') === 'true';
      db.collection('users').doc(uid).update({ active: !current })
        .catch(e=>showError('Erro ao atualizar acesso: '+e.message));
    };
  });
  document.querySelectorAll('[data-toggle-loans]').forEach(el=>{
    el.onclick = () => {
      const uid = el.getAttribute('data-toggle-loans');
      const current = el.getAttribute('data-current') === 'true';
      db.collection('users').doc(uid).update({ canLoans: !current })
        .catch(e=>showError('Erro ao atualizar permissão: '+e.message));
    };
  });
  const addUserBtn = document.getElementById('openAddUser');
  if(addUserBtn) addUserBtn.onclick = openAddUserForm;
  document.querySelectorAll('[data-delete-user]').forEach(btn=>{
    btn.onclick = () => removeUserAccount(btn.getAttribute('data-delete-user'), btn.getAttribute('data-delete-username'));
  });
}

function shiftMonth(delta){
  const d = new Date(state.refMonth);
  d.setMonth(d.getMonth()+delta);
  state.refMonth = d;
  render();
}

// ---------- tab bar ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.tab = btn.dataset.tab;
    render();
  });
});

// ---------- FAB ----------
fabBtn.addEventListener('click', ()=>{
  if(state.tab === 'emprestimos') openLoanForm();

});

// ---------- Tx form ----------
function openTxForm(){
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Novo lançamento</div>
        <button class="icon-btn" id="closeTxForm">✕</button>
      </div>
      <div class="segmented">
        <button type="button" class="seg-btn active-expense" id="segExpense">Saída</button>
        <button type="button" class="seg-btn" id="segIncome">Entrada</button>
      </div>
      <label class="field-label">Valor</label>
      <input id="txAmount" inputmode="decimal" placeholder="0,00">
      <label class="field-label">Descrição</label>
      <input id="txDesc" placeholder="Ex: Supermercado">
      <label class="field-label">Categoria</label>
      <select id="txCategory"></select>
      <label class="field-label">Data</label>
      <input id="txDate" type="date" value="${todayISO()}">
      <button class="save-btn" id="txSave" disabled>Salvar lançamento</button>
    </div>
  `;
  document.body.appendChild(overlay);
  let type = 'expense';

  function fillCategories(){
    const sel = overlay.querySelector('#txCategory');
    const cats = type==='expense' ? CATS_EXPENSE : CATS_INCOME;
    sel.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  }
  fillCategories();

  const segExpense = overlay.querySelector('#segExpense');
  const segIncome = overlay.querySelector('#segIncome');
  segExpense.onclick = () => { type='expense'; segExpense.classList.add('active-expense'); segIncome.classList.remove('active-income'); fillCategories(); };
  segIncome.onclick = () => { type='income'; segIncome.classList.add('active-income'); segExpense.classList.remove('active-expense'); fillCategories(); };

  const amountInput = overlay.querySelector('#txAmount');
  const saveBtn = overlay.querySelector('#txSave');
  function validate(){
    const v = parseFloat(amountInput.value.replace(',','.'));
    saveBtn.disabled = !(v > 0);
  }
  amountInput.oninput = validate;

  overlay.querySelector('#closeTxForm').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  saveBtn.onclick = () => {
    const amount = parseFloat(amountInput.value.replace(',','.'));
    if(!(amount>0)) return;
    addTransaction({
      type,
      description: overlay.querySelector('#txDesc').value.trim(),
      amount,
      category: overlay.querySelector('#txCategory').value,
      date: overlay.querySelector('#txDate').value || todayISO(),
    });
    overlay.remove();
  };
}

      <div id="mensalFields" style="display:none;">
        <label class="field-label">Dia do mês</label>
        <input id="recDiaMes" inputmode="numeric" placeholder="Ex: 5" value="5">
      </div>
      <div id="parcelasFields" style="display:none;">
        <label class="field-label">Total de parcelas</label>
        <input id="recParcelasTotal" inputmode="numeric" placeholder="Ex: 6">
        <label class="field-label">Parcelas já pagas</label>
        <input id="recParcelasPagas" inputmode="numeric" placeholder="0" value="0">
      </div>

      <label class="field-label">Data de início</label>
      <input id="recDataInicio" type="date" value="${todayISO()}">

      <button class="save-btn" id="recSave" disabled>Salvar fonte de renda</button>
    </div>
  `;
  document.body.appendChild(overlay);

  let direcao = 'entrada';
  const tipoField = overlay.querySelector('#tipoField');
  const categoriaField = overlay.querySelector('#categoriaField');
  const veiculoField = overlay.querySelector('#veiculoField');
  const recTipoSelect = overlay.querySelector('#recTipo');
  const segEntrada = overlay.querySelector('#segEntrada');
  const segSaida = overlay.querySelector('#segSaida');
  const sheetTitle = overlay.querySelector('.sheet-title');
  const saveBtnLabel = () => saveBtn.textContent = direcao==='saida' ? 'Salvar gasto fixo' : 'Salvar fonte de renda';

  function syncVeiculoField(){ veiculoField.style.display = (direcao==='entrada' && recTipoSelect.value === 'frota') ? '' : 'none'; }
  function setDirecao(d){
    direcao = d;
    segEntrada.classList.toggle('active-income', d==='entrada');
    segSaida.classList.toggle('active-expense', d==='saida');
    tipoField.style.display = d==='entrada' ? '' : 'none';
    categoriaField.style.display = d==='saida' ? '' : 'none';
    sheetTitle.textContent = d==='saida' ? 'Novo gasto fixo' : 'Nova fonte de renda';
    saveBtnLabel();
    syncVeiculoField();
  }
  segEntrada.onclick = () => setDirecao('entrada');
  segSaida.onclick = () => setDirecao('saida');
  recTipoSelect.onchange = syncVeiculoField;

  let frequencia = 'semanal';
  const semanalFields = overlay.querySelector('#semanalFields');
  const mensalFields = overlay.querySelector('#mensalFields');
  const parcelasFields = overlay.querySelector('#parcelasFields');
  const segSemanal = overlay.querySelector('#segSemanal');
  const segMensal = overlay.querySelector('#segMensal');
  const segParcelas = overlay.querySelector('#segParcelas');
  function setFreq(f){
    frequencia = f;
    [segSemanal,segMensal,segParcelas].forEach(b=>b.classList.remove('active-gold'));
    semanalFields.style.display = 'none'; mensalFields.style.display='none'; parcelasFields.style.display='none';
    if(f==='semanal'){ segSemanal.classList.add('active-gold'); semanalFields.style.display=''; }
    if(f==='mensal'){ segMensal.classList.add('active-gold'); mensalFields.style.display=''; }
    if(f==='parcelas'){ segParcelas.classList.add('active-gold'); parcelasFields.style.display=''; }
    validate();
  }
  segSemanal.onclick = () => setFreq('semanal');
  segMensal.onclick = () => setFreq('mensal');
  segParcelas.onclick = () => setFreq('parcelas');

  const valorInput = overlay.querySelector('#recValor');
  const parcelasTotalInput = overlay.querySelector('#recParcelasTotal');
  const saveBtn = overlay.querySelector('#recSave');
  setDirecao('entrada');
  function validate(){
    const v = parseFloat(valorInput.value.replace(',','.'));
    let ok = v > 0;
    if(frequencia === 'parcelas'){
      const pt = parseInt(parcelasTotalInput.value, 10);
      ok = ok && pt > 0;
    }
    saveBtn.disabled = !ok;
  }
  [valorInput, parcelasTotalInput].forEach(el => el.oninput = validate);

  overlay.querySelector('#closeRecForm').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  saveBtn.onclick = () => {
    const valor = parseFloat(valorInput.value.replace(',','.'));
    if(!(valor>0)) return;
    const rec = {
      direcao,
      tipo: direcao==='entrada' ? overlay.querySelector('#recTipo').value : 'outro',
      categoria: direcao==='saida' ? overlay.querySelector('#recCategoria').value : '',
      descricao: overlay.querySelector('#recDesc').value.trim(),
      valor,
      frequencia,
      dataInicio: overlay.querySelector('#recDataInicio').value || todayISO(),
      ativo: true,
    };
    if(direcao==='entrada' && rec.tipo === 'frota'){
      const vId = overlay.querySelector('#recVeiculo').value;
      if(vId) rec.veiculoId = vId;
    }
    if(frequencia === 'semanal'){
      rec.diaSemana = parseInt(overlay.querySelector('#recDiaSemana').value, 10);
    }else if(frequencia === 'mensal'){
      rec.diaMes = Math.min(28, Math.max(1, parseInt(overlay.querySelector('#recDiaMes').value, 10) || 1));
    }else if(frequencia === 'parcelas'){
      const pt = parseInt(parcelasTotalInput.value, 10);
      if(!(pt>0)) return;
      rec.parcelasTotal = pt;
      const jaPagas = parseInt(overlay.querySelector('#recParcelasPagas').value, 10) || 0;
      const inicioDate = midnight(new Date(rec.dataInicio+'T00:00:00'));
      const seeded = [];
      for(let i=0; i<Math.min(jaPagas, pt); i++){
        seeded.push(toISO(addMonths(inicioDate, i)));
      }
      rec.receivedDates = seeded;
    }
    addRecurrence(rec);
    overlay.remove();
  };
}

function openLoanForm(){
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Novo empréstimo</div>
        <button class="icon-btn" id="closeLoanForm">✕</button>
      </div>
      <label class="field-label">Para quem</label>
      <input id="loanBorrower" placeholder="Nome da pessoa">
      <label class="field-label">Valor emprestado</label>
      <input id="loanPrincipal" inputmode="decimal" placeholder="0,00">

      <div class="segmented">
        <button type="button" class="seg-btn active-gold" id="segRateMode">Calcular por juros</button>
        <button type="button" class="seg-btn" id="segFixedMode">Valor fixo a receber</button>
        <button type="button" class="seg-btn" id="segParceladoMode">Parcelado</button>
      </div>

      <div id="rateModeFields">
        <label class="field-label">Juros ao mês (%)</label>
        <input id="loanRate" inputmode="decimal" placeholder="Ex: 5">
        <div class="segmented">
          <button type="button" class="seg-btn active-gold" id="segSimples">Juros simples</button>
          <button type="button" class="seg-btn" id="segComposto">Juros compostos</button>
        </div>
      </div>
      <div id="fixedModeFields" style="display:none;">
        <label class="field-label">Valor total a receber</label>
        <input id="loanExpected" inputmode="decimal" placeholder="0,00">
      </div>
      <div id="parceladoModeFields" style="display:none;">
        <label class="field-label">Juros total (R$)</label>
        <input id="loanJurosTotal" inputmode="decimal" placeholder="Ex: 400">
        <label class="field-label">Número de parcelas</label>
        <input id="loanNumParcelas" inputmode="numeric" placeholder="Ex: 8">
        <label class="field-label">Data da 1ª parcela</label>
        <input id="loanPrimeiraParcela" type="date">
      </div>

      <label class="field-label">Data do empréstimo</label>
      <input id="loanDate" type="date" value="${todayISO()}">
      <div id="dueDateField">
        <label class="field-label">Data de vencimento</label>
        <input id="loanDue" type="date">
      </div>

      <div id="lateFeeFields">
        <label class="field-label">Multa por atraso (por dia)</label>
        <div class="segmented">
          <button type="button" class="seg-btn active-gold" id="segFeeFixed">Fixo (R$/dia)</button>
          <button type="button" class="seg-btn" id="segFeePercent">Percentual (%/dia)</button>
        </div>
        <input id="loanFeeValue" inputmode="decimal" placeholder="Ex: 5" value="0">
      </div>

      <button class="save-btn" id="loanSave" disabled>Salvar empréstimo</button>
    </div>
  `;
  document.body.appendChild(overlay);

  let calcMode = 'rate';
  let compound = false;
  let feeMode = 'fixed';

  const rateModeFields = overlay.querySelector('#rateModeFields');
  const fixedModeFields = overlay.querySelector('#fixedModeFields');
  const parceladoModeFields = overlay.querySelector('#parceladoModeFields');
  const dueDateField = overlay.querySelector('#dueDateField');
  const lateFeeFields = overlay.querySelector('#lateFeeFields');
  const segRateMode = overlay.querySelector('#segRateMode');
  const segFixedMode = overlay.querySelector('#segFixedMode');
  const segParceladoMode = overlay.querySelector('#segParceladoMode');
  function selectMode(mode){
    calcMode = mode;
    [segRateMode, segFixedMode, segParceladoMode].forEach(b=>b.classList.remove('active-gold'));
    rateModeFields.style.display='none'; fixedModeFields.style.display='none'; parceladoModeFields.style.display='none';
    dueDateField.style.display=''; lateFeeFields.style.display='';
    if(mode==='rate'){ segRateMode.classList.add('active-gold'); rateModeFields.style.display=''; }
    if(mode==='fixed'){ segFixedMode.classList.add('active-gold'); fixedModeFields.style.display=''; }
    if(mode==='parcelado'){
      segParceladoMode.classList.add('active-gold'); parceladoModeFields.style.display='';
      dueDateField.style.display='none'; lateFeeFields.style.display='none';
    }
    validate();
  }
  segRateMode.onclick = () => selectMode('rate');
  segFixedMode.onclick = () => selectMode('fixed');
  segParceladoMode.onclick = () => selectMode('parcelado');

  const segSimples = overlay.querySelector('#segSimples');
  const segComposto = overlay.querySelector('#segComposto');
  segSimples.onclick = () => { compound=false; segSimples.classList.add('active-gold'); segComposto.classList.remove('active-gold'); };
  segComposto.onclick = () => { compound=true; segComposto.classList.add('active-gold'); segSimples.classList.remove('active-gold'); };

  const segFeeFixed = overlay.querySelector('#segFeeFixed');
  const segFeePercent = overlay.querySelector('#segFeePercent');
  segFeeFixed.onclick = () => { feeMode='fixed'; segFeeFixed.classList.add('active-gold'); segFeePercent.classList.remove('active-gold'); };
  segFeePercent.onclick = () => { feeMode='percent'; segFeePercent.classList.add('active-gold'); segFeeFixed.classList.remove('active-gold'); };

  const borrowerInput = overlay.querySelector('#loanBorrower');
  const principalInput = overlay.querySelector('#loanPrincipal');
  const rateInput = overlay.querySelector('#loanRate');
  const expectedInput = overlay.querySelector('#loanExpected');
  const jurosTotalInput = overlay.querySelector('#loanJurosTotal');
  const numParcelasInput = overlay.querySelector('#loanNumParcelas');
  const primeiraParcelaInput = overlay.querySelector('#loanPrimeiraParcela');
  const saveBtn = overlay.querySelector('#loanSave');

  function validate(){
    const p = parseFloat(principalInput.value.replace(',','.'));
    const borrowerOk = !!borrowerInput.value.trim();
    let modeOk = false;
    if(calcMode === 'rate'){
      const r = parseFloat(rateInput.value.replace(',','.'));
      modeOk = !isNaN(r);
    }else if(calcMode === 'fixed'){
      const e = parseFloat(expectedInput.value.replace(',','.'));
      modeOk = e > 0;
    }else{
      const jt = parseFloat(jurosTotalInput.value.replace(',','.'));
      const np = parseInt(numParcelasInput.value, 10);
      modeOk = !isNaN(jt) && jt >= 0 && np > 0 && !!primeiraParcelaInput.value;
    }
    saveBtn.disabled = !(borrowerOk && p > 0 && modeOk);
  }
  [borrowerInput, principalInput, rateInput, expectedInput, jurosTotalInput, numParcelasInput, primeiraParcelaInput].forEach(el => el.oninput = validate);
  primeiraParcelaInput.onchange = validate;

  overlay.querySelector('#closeLoanForm').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  saveBtn.onclick = () => {
    const principal = parseFloat(principalInput.value.replace(',','.'));
    const rate = parseFloat(rateInput.value.replace(',','.')) || 0;
    const expected = parseFloat(expectedInput.value.replace(',','.')) || null;
    const jurosTotal = parseFloat(jurosTotalInput.value.replace(',','.')) || 0;
    const numParcelas = parseInt(numParcelasInput.value, 10) || 0;
    if(!(borrowerInput.value.trim() && principal>0)) return;
    if(calcMode==='rate' && isNaN(rate)) return;
    if(calcMode==='fixed' && !(expected>0)) return;
    if(calcMode==='parcelado' && !(numParcelas>0 && primeiraParcelaInput.value)) return;

    const feeValue = parseFloat(overlay.querySelector('#loanFeeValue').value.replace(',','.')) || 0;
    const borrowerName = borrowerInput.value.trim();
    const loanStartDate = overlay.querySelector('#loanDate').value || todayISO();

    addLoan({
      borrower: borrowerName,
      principal,
      calcMode,
      rate: calcMode==='rate' ? rate : 0,
      compound,
      expectedAmount: calcMode==='fixed' ? expected : null,
      jurosTotal: calcMode==='parcelado' ? jurosTotal : 0,
      numParcelas: calcMode==='parcelado' ? numParcelas : null,
      primeiraParcelaData: calcMode==='parcelado' ? primeiraParcelaInput.value : null,
      parcelasPagasCount: 0,
      startDate: loanStartDate,
      dueDate: calcMode==='parcelado' ? null : (overlay.querySelector('#loanDue').value || null),
      lateFee: { mode: feeMode, value: feeValue },
      status: 'active',
    });

    addTransaction({
      type: 'expense',
      description: `Empréstimo concedido - ${borrowerName}`,
      amount: principal,
      category: 'Empréstimo',
      date: loanStartDate,
    });

    overlay.remove();
  };
}

// ---------- Dar baixa (mark as paid) form ----------
function openMarkPaidForm(loanId){
  const loan = state.data.loans.find(l=>l.id===loanId);
  if(!loan) return;
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Dar baixa · ${escapeHtml(loan.borrower)}</div>
        <button class="icon-btn" id="closePaidForm">✕</button>
      </div>
      <label class="field-label">Data do pagamento</label>
      <input id="paidDateInput" type="date" value="${todayISO()}">
      <button class="save-btn" id="paidSave">Confirmar pagamento</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#closePaidForm').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  overlay.querySelector('#paidSave').onclick = () => {
    const paidDate = overlay.querySelector('#paidDateInput').value || todayISO();
    const normalized = normalizeLoan(loan);
    const { juros, lateFeeTotal } = computeLoanAmounts(normalized, new Date(paidDate+'T00:00:00'));
    const totalGanho = juros + lateFeeTotal;

    updateLoan(loanId, { status:'paid', paidDate });

    if(totalGanho > 0){
      const desc = lateFeeTotal > 0
        ? `Juros + multa recebidos - ${loan.borrower}`
        : `Juros recebido - ${loan.borrower}`;
      addTransaction({
        type: 'income',
        description: desc,
        amount: totalGanho,
        category: 'Rendimentos',
        date: paidDate,
      });
    }
    overlay.remove();
  };
}

// ---------- Adicionar usuário (admin) ----------
function removeUserAccount(uid, username){
  if(!confirm(`Remover o acesso de "${username || 'este usuário'}"? Isso remove o cadastro dele do app e ele não vai mais conseguir entrar. Essa ação não pode ser desfeita.`)) return;
  db.collection('users').doc(uid).delete()
    .then(()=> showToast('Usuário removido.'))
    .catch(e=>showError('Erro ao remover usuário: '+e.message));
}

function openAddUserForm(){
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Adicionar usuário</div>
        <button class="icon-btn" id="closeAddUser">✕</button>
      </div>
      <label class="field-label">Nome de usuário (sem espaços)</label>
      <input id="newUsername" autocapitalize="off" placeholder="ex: joao.silva">
      <label class="field-label">Senha temporária</label>
      <input id="newPassword" type="text" placeholder="mínimo 6 caracteres">
      <label class="field-label">Tipo de conta</label>
      <select id="newRole">
        <option value="user">Usuário comum</option>
        <option value="admin">Administrador</option>
      </select>
      <button class="save-btn" id="addUserSave">Criar acesso</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeAddUser').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  overlay.querySelector('#addUserSave').onclick = async () => {
    const username = overlay.querySelector('#newUsername').value.trim();
    const password = overlay.querySelector('#newPassword').value;
    const role = overlay.querySelector('#newRole').value;
    if(!username || password.length < 6){
      showError('Preencha usuário e uma senha com 6+ caracteres.');
      return;
    }
    const btn = overlay.querySelector('#addUserSave');
    btn.disabled = true; btn.textContent = 'Criando...';
    // App secundário evita deslogar o admin ao criar a nova conta
    let secondaryApp;
    try{
      secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary-' + Date.now());
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(usernameToEmail(username), password);
      await db.collection('users').doc(cred.user.uid).set({
        username, role, active: true, canLoans: false, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await secondaryApp.auth().signOut();
      overlay.remove();
    }catch(e){
      showError('Erro ao criar usuário: ' + e.message);
      btn.disabled = false; btn.textContent = 'Criar acesso';
    }finally{
      if(secondaryApp) secondaryApp.delete().catch(()=>{});
    }
  };
}
